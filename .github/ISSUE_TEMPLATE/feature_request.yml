name: Feature request
description: Propose a new scanner, option, or API for ai_guardrails.
title: "[feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Per CONTRIBUTING, an accepted issue is required before opening a PR.
        File this first so the API can be agreed on before code is written.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that ai_guardrails can't do today?
    validations:
      required: true
  - type: textarea
    id: api_sketch
    attributes:
      label: Proposed API sketch
      description: A rough Dart signature or usage example of what you'd want.
      render: dart
      placeholder: |
        final scanner = MyScanner(threshold: 0.7);
        guard.run(input: ..., llmCall: ...);
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why they fall short.
    validations:
      required: false
  - type: dropdown
    id: contribute
    attributes:
      label: Willingness to contribute
      options:
        - I'm willing to open a PR once this issue is accepted.
        - I can help test / review.
        - I'm only requesting; someone else would need to build it.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before you submit
      options:
        - label: I understand an accepted issue is required before a PR (per CONTRIBUTING).
          required: true
