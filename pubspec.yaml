name: ai_guardrails
description: >-
  On-device, provider-agnostic input/output safety for Dart & Flutter AI apps:
  PII redaction, prompt-injection and secret detection, output validation.
version: 0.9.0
repository: https://github.com/GhagSagar23/ai_guardrails
issue_tracker: https://github.com/GhagSagar23/ai_guardrails/issues
topics:
  - ai
  - security
  - guardrails
  - llm
  - pii

environment:
  sdk: ^3.5.0

workspace:
  - packages/ai_guardrails_google
  - packages/ai_guardrails_anthropic
  - packages/ai_guardrails_langchain

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
