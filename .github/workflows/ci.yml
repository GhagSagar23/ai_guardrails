name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  core:
    name: Core package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: dart analyze --fatal-infos lib test
      - run: dart test

  wrappers:
    name: Wrapper — ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - ai_guardrails_google
          - ai_guardrails_anthropic
          - ai_guardrails_langchain
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
        working-directory: packages/${{ matrix.package }}
      - run: dart format --output=none --set-exit-if-changed .
        working-directory: packages/${{ matrix.package }}
      - run: dart analyze --fatal-infos
        working-directory: packages/${{ matrix.package }}
      - name: Run tests
        working-directory: packages/${{ matrix.package }}
        run: |
          if [ -d test ]; then
            dart test
          else
            echo "No tests yet — skipping"
          fi
