name: ai_guardrails
repository: https://github.com/GhagSagar23/ai_guardrails

packages:
  - packages/**

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    run: dart analyze --fatal-infos
    exec:
      concurrency: 1
    description: Run dart analyze in all packages.

  format:
    run: dart format --output=none --set-exit-if-changed .
    description: Check formatting across all packages.

  test:
    run: dart test
    exec:
      concurrency: 1
    packageFilters:
      dirExists: test
    description: Run tests in all packages that have a test directory.

  test:core:
    run: dart test
    packageFilters:
      scope: ai_guardrails
    description: Run tests for the core package only.
